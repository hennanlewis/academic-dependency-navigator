<!DOCTYPE html>
<html lang="pt-br" data-theme="light" data-page="index">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Academic Dependency Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="css/tokens.css" rel="stylesheet" />
  <link href="css/base.css" rel="stylesheet" />
  <link href="css/components.css" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <div id="app-nav" class="app-nav-slot"></div>
    <div class="app-shell-main">
      <header class="app-header">
        <div class="app-header-inner">
          <div>
            <h1 class="headline-md text-primary">Dashboard</h1>
            <p class="label-md text-on-surface-variant" id="course-meta">Carregando…</p>
          </div>
          <button id="theme-toggle" class="btn" type="button">Escuro</button>
        </div>
      </header>

      <main class="app-main dashboard-layout">
        <section class="dashboard-col dashboard-left">
          <div class="card">
            <div class="card-head">
              <h2 class="headline-md text-primary">Cursando</h2>
              <span class="label-sm text-on-surface-variant" id="cursando-count"></span>
            </div>
            <p class="label-md text-on-surface-variant dashboard-hint">
              Apenas visualização. Para mudar status ou mover, use a página Matriz.
            </p>
            <div id="cursando-list" class="dashboard-list"></div>
          </div>
        </section>

        <section class="dashboard-col dashboard-right">
          <div class="card">
            <div class="card-head">
              <h2 class="headline-md text-primary">Progresso do currículo</h2>
            </div>
            <div id="history-stats" class="stat-list"></div>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span class="label-sm text-outline">Rodando via ES Modules — sem framework, sem build.</span>
      </footer>
    </div>
  </div>

  <script type="module" src="src/ui/dashboard.js"></script>
</body>
</html>
