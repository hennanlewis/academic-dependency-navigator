<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização de Currículo - Dependências de Disciplinas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>📚 Matriz Curricular Letras - Inglês (IFCE Camocim)</h1>
        <div class="subtitle">Clique em qualquer disciplina para ver seus pré-requisitos e disciplinas que ela libera
        </div>

        <button onclick="resetSelection()">🔄 Limpar Seleção</button>

        <div id="curriculum-container"></div>

        <div id="status-menu" class="status-menu" popover>
            <button data-status="completed">✅ Aprovada</button>
            <button data-status="current">⏳ Cursando</button>
            <button data-status="failed">❌ Reprovada</button>
            <hr>
            <button id="move-semester-btn" data-action="move-semester">📦 Mover semestre</button>
            <button id="new-attempt-btn" data-action="new-attempt">📄 Nova tentativa</button>
            <hr>
            <button data-status="">Restaurar</button>
        </div>

        <div id="semester-dialog" popover>
            <h3>Selecionar semestre</h3>

            <select id="semester-select">
                <option value="1">1º Semestre</option>
                <option value="2">2º Semestre</option>
                <option value="3">3º Semestre</option>
                <option value="4">4º Semestre</option>
                <option value="5">5º Semestre</option>
                <option value="6">6º Semestre</option>
                <option value="7">7º Semestre</option>
                <option value="8">8º Semestre</option>
                <option value="9">9º Semestre</option>
                <option value="10">10º Semestre</option>
            </select>

            <button id="semester-confirm">Confirmar</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
